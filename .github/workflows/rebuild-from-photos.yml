name: Process New Lae Port Photos

on:
  push:
    branches: [main]
    paths:
      - 'incoming-photos/**/*.jpg'
      - 'incoming-photos/**/*.jpeg'
      - 'incoming-photos/**/*.JPG'
      - 'incoming-photos/**/*.JPEG'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lae-port-photo-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install image tools
        run: python -m pip install -r tools/requirements.txt

      - name: Rebuild 2D map and 3D tour
        run: python tools/rebuild_lae_port_site.py incoming-photos github-pages

      - name: Remove processed uploads
        shell: bash
        run: find incoming-photos -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -delete

      - name: Commit rebuilt stakeholder site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- github-pages/index.html github-pages/3d/index.html github-pages/data/Lae_Port_Photos.js github-pages/map github-pages/terrain incoming-photos
          if git diff --cached --quiet; then
            echo "No new website content was generated."
            exit 0
          fi
          git commit -m "Process uploaded Lae Port photos [skip rebuild]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rebuilt site
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      - name: Deploy rebuilt site
        id: deployment
        uses: actions/deploy-pages@v4
